<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Message For You</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --envelope-color: #f3f4f6;
            --envelope-flap-color: #e5e7eb;
            --paper-color: #ffffff;
            --accent-color: #ef4444;
        }

        body {
            background-color: #fee2e2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .envelope-wrapper:hover {
            transform: translateY(-10px);
        }

        .envelope {
            position: relative;
            width: 450px;
            height: 250px;
            background-color: var(--envelope-color);
            border-radius: 0 0 8px 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .envelope::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 125px 225px 0 225px;
            border-color: var(--envelope-flap-color) transparent transparent transparent;
            z-index: 30;
            transform-origin: top;
            transition: transform 0.5s ease-in-out;
        }

        .envelope.open::before {
            transform: rotateX(180px);
            z-index: 5;
        }

        .envelope::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 225px 125px 225px;
            border-color: transparent var(--envelope-color) var(--envelope-color) var(--envelope-color);
            z-index: 25;
        }

        .envelope-sides {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 125px 0 125px 225px;
            border-color: transparent transparent transparent var(--envelope-flap-color);
            z-index: 20;
        }

        .envelope-sides::after {
            content: "";
            position: absolute;
            top: -125px;
            right: -225px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 125px 225px 125px 0;
            border-color: transparent var(--envelope-flap-color) transparent transparent;
        }

        .paper {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 410px;
            height: 230px;
            background-color: var(--paper-color);
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            z-index: 15;
            transition: transform 0.8s ease-in-out, bottom 0.8s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .envelope.open .paper {
            transform: translateX(-50%) translateY(-150px);
            height: 380px;
            z-index: 40;
        }

        .heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent-color);
            font-size: 2rem;
            z-index: 35;
            transition: opacity 0.3s ease;
        }

        .envelope.open .heart {
            opacity: 0;
        }

        .message-text {
            font-size: 1.1rem;
            color: #374151;
            line-height: 1.6;
            opacity: 0;
            transition: opacity 0.5s ease 0.5s;
        }

        .envelope.open .message-text {
            opacity: 1;
        }

        .instruction {
            position: absolute;
            bottom: -50px;
            left: 0;
            right: 0;
            text-align: center;
            color: #991b1b;
            font-weight: 500;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
    </style>
</head>
<body>

    <div class="envelope-wrapper" onclick="toggleEnvelope()">
        <div class="envelope" id="envelope">
            <div class="envelope-sides"></div>
            <div class="paper">
                <div class="message-text">
                    <h2 class="text-2xl font-bold mb-4 text-red-600">A Little Poem...</h2>
                    <p>Roses are red,</p>
                    <p>I don't understand why violets are blue,</p>
                    <p>That was defintely <strong>The Worst Fourth Date Ever™</strong>,</p>
                    <p>I wouldn't have enjoyed it as much with anyone but you! :)</p>
                    <div class="mt-6 text-red-500">
                        <i class="fas fa-heart"></i>
                    </div>
                </div>
            </div>
            <div class="heart">
                <i class="fas fa-heart"></i>
            </div>
        </div>
        <div class="instruction" id="instruction">Click to open</div>
    </div>

    <script>
        function toggleEnvelope() {
            const envelope = document.getElementById('envelope');
            const instruction = document.getElementById('instruction');
            
            envelope.classList.toggle('open');
            
            if (envelope.classList.contains('open')) {
                instruction.innerText = 'Click to close';
            } else {
                instruction.innerText = 'Click to open';
            }
        }
    </script>
</body>
</html>
