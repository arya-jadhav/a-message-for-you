<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Message For You</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --envelope-color: #f3f4f6;
            --envelope-flap-color: #e5e7eb;
            --paper-color: #ffffff;
            --accent-color: #ef4444;
            --wax-seal-color: #991b1b;
        }

        body {
            background-color: #fee2e2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .envelope-wrapper:hover {
            transform: translateY(-10px);
        }

        .scatter-photo {
            position: absolute;
            width: 150px;
            height: 150px;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 5;
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            opacity: 0;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.1);
        }

        .scatter-photo.active {
            opacity: 1;
            pointer-events: auto;
        }

        .envelope {
            position: relative;
            width: 450px;
            height: 250px;
            background-color: var(--envelope-color);
            border-radius: 0 0 8px 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .envelope::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 125px 225px 0 225px;
            border-color: var(--envelope-flap-color) transparent transparent transparent;
            z-index: 30;
            transform-origin: top;
            transition: transform 0.5s ease-in-out;
        }

        .envelope.open::before {
            transform: rotateX(180px);
            z-index: 5;
        }

        .envelope::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 225px 125px 225px;
            border-color: transparent var(--envelope-color) var(--envelope-color) var(--envelope-color);
            z-index: 25;
        }

        .envelope-sides {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 125px 0 125px 225px;
            border-color: transparent transparent transparent var(--envelope-flap-color);
            z-index: 20;
        }

        .envelope-sides::after {
            content: "";
            position: absolute;
            top: -125px;
            right: -225px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 125px 225px 125px 0;
            border-color: transparent var(--envelope-flap-color) transparent transparent;
        }

        .paper {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 410px;
            height: 230px;
            background-color: var(--paper-color);
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            z-index: 15;
            transition: transform 0.8s ease-in-out, bottom 0.8s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .envelope.open .paper {
            transform: translateX(-50%) translateY(-150px);
            height: 380px;
            z-index: 40;
        }

        .wax-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background-color: var(--wax-seal-color);
            border-radius: 50%;
            z-index: 35;
            transition: opacity 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #7f1d1d;
        }

        .wax-seal::before {
            content: "A";
            color: #7f1d1d;
            font-family: 'Times New Roman', serif;
            font-weight: bold;
            font-size: 1.5rem;
            opacity: 0.6;
        }

        .envelope.open .wax-seal {
            opacity: 0;
        }

        .message-text {
            font-size: 1.1rem;
            color: #374151;
            line-height: 1.6;
            opacity: 0;
            transition: opacity 0.5s ease 0.5s;
        }

        .envelope.open .message-text {
            opacity: 1;
        }

        .instruction {
            position: absolute;
            bottom: -50px;
            left: 0;
            right: 0;
            text-align: center;
            color: #991b1b;
            font-weight: 500;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
    </style>
</head>
<body>

    <div class="envelope-wrapper" onclick="toggleEnvelope()">
        <div class="envelope" id="envelope">
            <div class="envelope-sides"></div>
            <div class="paper">
                <div class="message-text">
                    <h2 class="text-2xl font-bold mb-4 text-red-600">A Poem For You</h2>
                    <p>Roses are red,</p>
                    <p>I don't understand why violets are blue,</p>
                    <p>That was defintely <strong>The Worst Fourth Date Ever™</strong>,</p>
                    <p>I wouldn't have enjoyed it as much with anyone but you! :)</p>
                </div>
            </div>
            <div class="wax-seal"></div>
        </div>
        <div class="instruction" id="instruction">Click to open</div>
    </div>

    <script>
        const images = [
            'parking.jpg',
            'smiths.jpg',
            'vinyl.png',
            'chappell.jpeg'
        ];

        function toggleEnvelope() {
            const envelope = document.getElementById('envelope');
            const instruction = document.getElementById('instruction');
            const wrapper = document.querySelector('.envelope-wrapper');
            
            envelope.classList.toggle('open');
            
            if (envelope.classList.contains('open')) {
                instruction.innerText = 'Click to close';
                scatterImages(wrapper);
            } else {
                instruction.innerText = 'Click to open';
                removeImages();
            }
        }

        function scatterImages(container) {
            images.forEach((src, index) => {
                const img = document.createElement('img');
                img.src = src;
                img.className = 'scatter-photo';
                container.appendChild(img);

                // Small delay for each image to make the burst look better
                setTimeout(() => {
                    img.classList.add('active');
                    const randomX = (Math.random() - 0.5) * 800; // Random horizontal spread
                    const randomY = (Math.random() - 0.5) * 600; // Random vertical spread
                    const randomRot = (Math.random() - 0.5) * 60; // Random rotation

                    img.style.transform = `translate(calc(-50% + ${randomX}px), calc(-50% + ${randomY}px)) rotate(${randomRot}deg) scale(1)`;
                }, index * 100);
            });
        }

        function removeImages() {
            const photos = document.querySelectorAll('.scatter-photo');
            photos.forEach(photo => {
                photo.style.transform = 'translate(-50%, -50%) scale(0)';
                photo.style.opacity = '0';
                setTimeout(() => photo.remove(), 1000);
            });
        }
    </script>
</body>
</html>
